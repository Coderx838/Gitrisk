[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitrisk"
version = "0.3.1"
description = "A privacy-first, local-first security and repository-health scanner for Git repositories."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "GitRisk Contributors" },
]
keywords = ["security", "git", "scanner", "cli", "devtools", "sast"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "gitpython>=3.1.40",
  "pathspec>=0.12.1",
  "tomli>=2.0.1; python_version < '3.11'",
  "requests>=2.31.0",
  "packaging>=24.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.scripts]
gitrisk = "gitrisk.cli.main:app"

[project.urls]
Homepage = "https://github.com/gitrisk/gitrisk"
Repository = "https://github.com/gitrisk/gitrisk"
Issues = "https://github.com/gitrisk/gitrisk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gitrisk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
